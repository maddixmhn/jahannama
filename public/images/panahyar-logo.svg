<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
  <title id="title">Panahyar Logo</title>
  <desc id="desc">Panahyar Case Management full logo with icon and wordmark.</desc>
  <defs>
    <linearGradient id="leftG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FA8DE"/>
      <stop offset="100%" stop-color="#2F6EA9"/>
    </linearGradient>
    <linearGradient id="rightG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58B4E6"/>
      <stop offset="100%" stop-color="#295E96"/>
    </linearGradient>
  </defs>

  <g transform="translate(120,24)">
    <circle cx="140" cy="95" r="95" fill="url(#leftG)"/>
    <circle cx="300" cy="95" r="95" fill="url(#rightG)"/>

    <path d="M201 0A95 95 0 0 0 140 190A95 95 0 0 0 201 0Z" fill="#1F4E86"/>
    <path d="M239 0A95 95 0 0 1 300 190A95 95 0 0 1 239 0Z" fill="#1A4B84"/>

    <circle cx="220" cy="95" r="45" fill="none" stroke="#FFFFFF" stroke-width="18"/>
    <circle cx="220" cy="95" r="29" fill="#356EA8"/>
    <rect x="212" y="130" width="16" height="60" rx="8" fill="#FFFFFF"/>
  </g>

  <text x="380" y="255" text-anchor="middle" font-family="'Segoe UI', Tahoma, sans-serif" font-size="64" letter-spacing="12" fill="#1E4F86">PANAHYAR</text>
  <text x="380" y="295" text-anchor="middle" font-family="'Segoe UI', Tahoma, sans-serif" font-size="30" letter-spacing="8" fill="#53A8DF">CASE MANAGEMENT</text>
</svg>
